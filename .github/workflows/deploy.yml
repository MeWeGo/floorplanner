name: Deploy to GitHub Pages

# main only deploys after the whole CI suite passes. This replaces the old
# "deploy from a branch" behaviour, which published every push immediately —
# including one that crashed the app on boot (#b3dFit).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test before deploy
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Enables Pages with "GitHub Actions" as the source. If the token cannot
      # change repository settings, set Settings ▸ Pages ▸ Source to
      # "GitHub Actions" once and this step becomes a no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the app itself. Uploading the repo root also served
      # legacy-index.html (an old prototype search engines could list next to
      # the real app), AGENTS.md, tests/ and mcp/. If app.js ever loads another
      # local file, add it here — the smoke test runs from the repo, not _site.
      - name: Stage the static site
        run: |
          mkdir _site
          cp index.html app.js style.css _site/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
