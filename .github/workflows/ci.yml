name: CI

# Runs on every branch push and every pull request. `main` is excluded here
# because deploy.yml calls this same workflow before publishing.
on:
  push:
    branches-ignore: ['main']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, DOM contract, MCP and bridge tests
        run: node --test tests/*.test.js

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make sure a Chromium is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          fi
      - name: Boot the app and drive the main flows
        run: node tests/browser-smoke.js
