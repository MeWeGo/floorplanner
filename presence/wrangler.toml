name = "floorplanner-presence"
main = "worker.mjs"
compatibility_date = "2025-04-07"

[vars]
ALLOWED_ORIGINS = "https://mewego.github.io"

[durable_objects]
bindings = [
  { name = "PRESENCE", class_name = "PresenceRoom" },
  { name = "COLLAB", class_name = "CollabRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CollabRoom"]
