<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kat Planı Çizici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand-cluster">
      <span class="logo" id="logoTxt">📐 Kat Planı</span>
      <input id="pname" title="Proje adı" value="Yeni Proje">
    </div>
    <div class="sep"></div>
    <div class="btn-group">
      <button class="btn" id="bNew">📄 Yeni</button>
      <button class="btn" id="bProjects">📁 Projelerim</button>
      <button class="btn primary" id="bSave" title="Tarayıcıya kaydet (Ctrl+S)">💾 Kaydet</button>
    </div>
    <div class="btn-group">
      <button class="btn" id="bJson" title="JSON dosyası olarak indir">⬇ JSON</button>
      <button class="btn" id="bOpen" title="JSON dosyası aç">📂 Aç</button>
    </div>
    <div class="sep"></div>
    <div class="btn-group seg-group">
      <button class="btn icon-btn" id="bUndo" title="Geri al (Ctrl+Z)">↶</button>
      <button class="btn icon-btn" id="bRedo" title="Yinele (Ctrl+Y)">↷</button>
    </div>
    <div class="sep"></div>
    <div class="btn-group">
      <button class="btn" id="bPng">🖼 PNG</button>
      <button class="btn" id="bSvg">SVG</button>
      <button class="btn" id="bPrint">🖨 PDF / Yazdır</button>
    </div>
    <div class="spacer"></div>
    <div class="btn-group seg-switch" role="group" aria-label="View mode">
      <button class="btn on" id="b2d">2B</button>
      <button class="btn" id="b3d">3B</button>
    </div>
    <div class="sep"></div>
    <div class="btn-group">
      <button class="btn" id="bLang" title="Dil / Language">🌐 EN</button>
      <button class="btn icon-btn" id="bTheme" title="Tema">🌓</button>
      <button class="btn" id="bHelp">❓ Yardım</button>
    </div>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    <input type="file" id="fileBg" accept="image/*" hidden>
  </header>
  <main>
    <nav id="tools" aria-label="Drafting tools"></nav>
    <aside id="lib">
      <div class="top">
        <input id="search" placeholder="🔍 Mobilya ara...">
        <div id="cats"></div>
      </div>
      <div id="items"></div>
    </aside>
    <section id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <g id="world">
          <g id="gBg"></g><g id="gGrid"></g><g id="gRooms"></g><g id="gWalls"></g><g id="gOps"></g>
          <g id="gFurn"></g><g id="gDims"></g><g id="gTexts"></g><g id="gSketch"></g><g id="gSel"></g><g id="gPv"></g>
        </g>
      </svg>
      <div id="v3d">
        <label class="ctl3d" for="s3dFloor"><span id="lbl3dFloor">Kat</span>
          <select id="s3dFloor"></select>
        </label>
      </div>
      <div id="hud"></div>
      <div id="shapeBar"></div>
      <div id="zoomctl">
        <button class="btn" id="zIn">+</button>
        <button class="btn" id="zOut">−</button>
        <button class="btn" id="zFit" title="Sığdır (0)">⤢</button>
      </div>
      <div id="toast"></div>
    </section>
    <aside id="props"></aside>
  </main>
  <footer>
    <div id="floors"></div>
    <div class="sep"></div>
    <div class="footer-controls">
      <label class="chk-pill"><input type="checkbox" id="cSnap" checked> <span id="lblSnap">Yakala (G)</span></label>
      <label class="chk-pill"><input type="checkbox" id="cAngle" checked> <span id="lblAngle">Açı 15°</span></label>
      <label class="chk-pill"><input type="checkbox" id="cDims" checked> <span id="lblDims">Duvar ölçüleri</span></label>
      <label class="chk-pill"><input type="checkbox" id="cConn" checked title="Sürüklerken bitişik duvar uçları birlikte gelir (Alt basılıysa tersine döner)"> <span id="lblConn">Bitişik duvarlar</span></label>
      <label class="ctl-field"><span id="lblBoxSel">Kutu Seçim</span>
        <select id="sBoxSel">
          <option value="all" selected>Tümü</option>
          <option value="wall">Duvarlar</option>
          <option value="furn">Mobilya</option>
        </select>
      </label>
      <div class="sep"></div>
      <label class="ctl-field"><span id="lblGridType">Izgara Tipi</span>
        <select id="sGridType">
          <option value="square" selected>⊞ Kare</option>
          <option value="triangle">△ Üçgen (60°)</option>
          <option value="dots">⁙ Noktalı</option>
          <option value="none">∅ Kapalı (Serbest)</option>
        </select>
      </label>
      <label class="ctl-field"><span id="lblGridStep">Adım</span>
        <select id="sGrid">
          <option value="5">5 cm</option>
          <option value="10" selected>10 cm</option>
          <option value="25">25 cm</option>
          <option value="50">50 cm</option>
          <option value="100">1 m (100 cm)</option>
          <option value="300">3 m (300 cm)</option>
          <option value="500">5 m (500 cm)</option>
          <option value="custom">Özel...</option>
        </select>
      </label>
      <label id="lblGridCustom" class="ctl-field" style="display:none">
        <input type="number" id="iGridCustom" min="1" max="10000" step="1" value="10" title="Özel ızgara adımı (cm)"> cm
      </label>
    </div>
    <div class="spacer"></div>
    <div class="telemetry">
      <span id="coords" class="muted"></span>
      <span id="zoomlbl" class="muted"></span>
    </div>
  </footer>
</div>
<div id="modalbg"><div id="modal"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="app.js"></script>
</body>
</html>
